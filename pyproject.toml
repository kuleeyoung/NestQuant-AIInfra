[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nestquant-aiinfra"
version = "0.1.0"
description = "A reproducible NestQuant reproduction and model-compression inference project"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.scripts]
nestquant-eval-ppl = "nestquant.experiments.llm_perplexity:main"
nestquant-summarize-ppl = "nestquant.evaluation.result_summary:main"
nestquant-reproduce = "nestquant.experiments.reproduction:main"
nestquant-inspect-nqmc = "nestquant.cli.inspect_nqmc:main"
nestquant-audit-repository = "nestquant.cli.audit_repository:main"
nestquant-validate-service-benchmark = "nestquant.cli.validate_service_benchmark:main"
nestquant-promote-service-benchmark = "nestquant.cli.promote_service_benchmark:main"
nestquant-verify-service-evidence = "nestquant.cli.verify_service_evidence:main"
nestquant-validate-hybrid-pareto = "nestquant.cli.validate_hybrid_pareto:main"
nestquant-promote-hybrid-pareto = "nestquant.cli.promote_hybrid_pareto:main"

[project.optional-dependencies]
evaluation = ["transformers>=4.45", "datasets>=3.0", "huggingface-hub>=0.25", "safetensors>=0.4"]
dev = ["transformers>=4.45", "pytest>=8.0"]
benchmark = ["lm_eval==0.4.13", "accelerate>=0.26"]

[tool.setuptools.packages.find]
include = ["nestquant*"]

[tool.setuptools.package-data]
"nestquant.runtime" = ["*.cu", "*.cuh", "*.cpp"]
